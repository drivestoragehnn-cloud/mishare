name: Build Android APK

# این ورک‌فلو مستقیم روی سرور گیت‌هاب بیلد می‌کنه، بدون داکر.
# از Android SDK از پیش نصب‌شده روی خود ران‌ر استفاده می‌کنه (پایدارتر از دانلود مجدد).

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: چک‌اوت کد
        uses: actions/checkout@v4

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: نصب پکیج‌های سیستمی مورد نیاز
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential

      - name: نصب Buildozer و Cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: تنظیم استفاده از Android SDK از پیش نصب‌شده روی ران‌ر
        working-directory: src
        run: |
          echo "استفاده از SDK موجود در: $ANDROID_HOME"
          # اگه خط android.sdk_path از قبل هست (کامنت یا نه) حذفش کن و مقدار درست رو بذار
          sed -i '/^#\?android\.sdk_path/d' buildozer.spec
          echo "android.sdk_path = $ANDROID_HOME" >> buildozer.spec
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: بیلد APK
        working-directory: src
        run: |
          yes | buildozer -v android debug

      - name: آپلود APK به عنوان خروجی قابل دانلود
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastshare-apk
          path: src/bin/*.apk
          if-no-files-found: warn

      - name: آپلود لاگ کامل بیلد برای عیب‌یابی
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: src/.buildozer/android/platform/build-*/dists/*/build.log
          if-no-files-found: ignore
